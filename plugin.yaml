name: provenance-gate
version: 0.1.0
author: "Simin (Simon) Yuan"
requires_hermes: ">=0.22.2"
description: >-
  Checks memory and skill_manage writes for sentences that state a user decision ("the user
  decided ...", "用户决定 ..."); each needs a quote that appears verbatim in text the user typed in
  this session and shares key words with the decision, or the write is refused with instructions.
  Disclosure — keeps a local copy of the text of user messages and their sender_id (30-day default
  retention, `hermes provenance-gate purge` command) and an evidence log under
  plugin-data/provenance-gate; refuses memory and skill writes that state a user decision without a
  verifiable quote (observe mode available); no network; never asks for approval.
provides_hooks:
  - pre_llm_call
  - pre_tool_call
